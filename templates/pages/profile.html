{{define "title"}}Albums{{end}}

{{define "content"}}

{{template "header" .}}

<main class="container">
    <div class="row p-5 bg-light rounded">
        <div class="col-12 col-md-6 col-lg-6 p-3 text-center">
            <img class="object-fit-cover rounded-circle mb-3" style="width: 300px; height: 300px;"
                src="{{ .User.ProfilePicture.DefaultSrc }}" srcset="{{ .User.ProfilePicture.SrcSet }}" sizes="300px" alt="{{ .User.ProfilePicture.Alt }}">
            <h4>{{ .User.FirstName }} {{ .User.LastName }}</h4>
            <p>{{ .User.Email }}</h4>
        </div>
        <div class="col-12 col-md-6 col-lg-6 p-3">
            <h2 class="mb-3">Profile</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="row">
                        <div class="col-6 fw-bold">
                            First Name:
                        </div>
                        <div class="col-6">
                            {{ .User.FirstName }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 fw-bold">
                            Last Name:
                        </div>
                        <div class="col-6">
                            {{ .User.LastName }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 fw-bold">
                            Email address:
                        </div>
                        <div class="col-6">
                            {{ .User.Email }}
                        </div>
                    </div>
                    <a class="btn btn-outline-primary mt-3" href="/profile/edit">Edit profile</a>
                </div>
            </div>
        </div>
    </div>
</main>

{{template "footer" .}}

{{end}}
